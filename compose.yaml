services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mn9
      POSTGRES_USER: mn9
      POSTGRES_PASSWORD: mn9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mn9 -d mn9"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mn9-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_MN9_AUTH_PORT: "28100"
      PN_MN9_SECURE_PORT: "28101"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_MN9_SECURE_HOST: ${PN_MN9_SECURE_HOST:-localhost}
      PN_MN9_POSTGRES_URI: postgres://mn9:mn9@postgres:5432/mn9?sslmode=disable
      PN_MN9_KERBEROS_PASSWORD: ${PN_MN9_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_MN9_LOCAL_MODE=0
      # and providing the two NEX_* secrets (matching your account server).
      PN_MN9_LOCAL_MODE: ${PN_MN9_LOCAL_MODE:-1}
      PN_MN9_SETTINGS_PATH: /home/go/app/settings.json
      PN_MN9_NEX_TOKEN_AES_KEY: ${PN_MN9_NEX_TOKEN_AES_KEY:-}
      PN_MN9_NEX_PASSWORD_SECRET: ${PN_MN9_NEX_PASSWORD_SECRET:-}
      # Optional S3 for DataStore object uploads (downloads work without it).
      PN_S3_ENDPOINT: ${PN_S3_ENDPOINT:-}
      PN_S3_ACCESS_KEY: ${PN_S3_ACCESS_KEY:-}
      PN_S3_SECRET_KEY: ${PN_S3_SECRET_KEY:-}
      PN_S3_BUCKET: ${PN_S3_BUCKET:-mn9-datastore}
    ports:
      - "28100:28100/udp"
      - "28101:28101/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  mn9-postgres:
